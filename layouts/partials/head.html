<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }} — 财经指标与WebMCP信息汇集{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
{{ with .Params.keywords }}<meta name="keywords" content="{{ delimit . ", " }}">{{ end }}
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="sitemap" type="application/xml" title="Sitemap" href="{{ "sitemap.xml" | relURL }}">
<link rel="alternate" type="text/plain" title="LLMs Plaintext Index" href="{{ "llms.txt" | relURL }}">
<link rel="alternate" type="application/json" title="Search & Agent JSON Index" href="{{ "index.json" | relURL }}">
<link rel="service-desc" type="application/json" href="{{ ".well-known/mcp.json" | relURL }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{ if .IsPage }}TechArticle{{ else }}DataCatalog{{ end }}",
  "name": {{ .Title | jsonify | safeJS }},
  "url": {{ .Permalink | jsonify | safeJS }},
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05+08:00" }}",
  "description": {{ with .Params.summary }}{{ . | jsonify | safeJS }}{{ else }}{{ .Site.Params.description | jsonify | safeJS }}{{ end }}
}
</script>
<style>
body { max-width: 820px; margin: 24px auto; padding: 0 16px; font-family: monospace; font-size: 13.5px; line-height: 1.65; color: #111; background: #fff; word-break: break-word; }
a { color: #0000ee; text-decoration: underline; }
a:visited { color: #551a8b; }
.stale, .stale a { color: #cc0000 !important; }
.kw { color: #444; cursor: pointer; text-decoration: none; margin-right: 4px; }
.kw:hover { text-decoration: underline; color: #0000ee; }
.ext { font-size: 12.5px; }
input[type="search"] { font-family: monospace; font-size: 13px; width: 100%; max-width: 520px; padding: 3px 6px; border: 1px solid #888; background: #fff; color: #111; }
.line { margin: 4px 0; }
.sec { margin: 16px 0 6px 0; font-weight: bold; }
.muted { color: #555; font-size: 12.5px; }
</style>
