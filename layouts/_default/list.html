{{ define "main" }}
<p class="taxonomy-title">{{ .Title }}</p>
{{- with .Description }}<p class="meta">{{ . }}</p>{{ end }}
<div class="search-bar">
  <input id="q" type="search" placeholder="在本分类模糊搜索..." oninput="runSearch()">
  <span id="search-stat" class="count">{{ len .RegularPages }}</span>
</div>
<ul class="post-list">
{{- range sort .RegularPages "Lastmod" "desc" }}
  {{ partial "item_li.html" . }}
{{- end }}
</ul>
{{ end }}
