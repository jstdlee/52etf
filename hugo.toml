baseURL = "https://jstdlee.github.io/52etf/"
languageCode = "zh-CN"
title = "52etf.net"
timeZone = "Asia/Singapore"
enableRobotsTXT = false
disableKinds = ["taxonomy", "term"]

[params]
  description = "52etf.net 常用经济指标缓存、有效连接汇总与WebMCP站点 (仅内容与连接呈现 不做任何解读与资产透露)"
  staleDaysLimit = 180
  refDate = "2026-10-24"

[mediaTypes]
  [mediaTypes."text/llms"]
    suffixes = ["txt"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/llms"
    baseName = "llms"
    isPlainText = true
    rel = "alternate"

[outputs]
  home = ["HTML", "JSON", "LLMS", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.8

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
